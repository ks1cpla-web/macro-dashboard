name: Macro Data Collector

on:
  schedule:
    # 매일 UTC 22:00 (한국 시간 오전 7시) 자동 실행
    - cron: '0 22 * * *'
  workflow_dispatch: # 버튼 눌러서 수동 실행 가능 기능

jobs:
  build-and-collect:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/checkout@v3
      with:
        python-version: '3.10'

    - name: Run Data Collector Script
      env:
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }} # FRED API 키 연결
      run: |
        python fetch_data.py

    - name: Commit and push if data changed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.json
        git diff-index --quiet HEAD || git commit -m "Auto-update macro data [skip ci]"
        git push
